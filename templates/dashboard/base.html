{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} · IT Eric</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --navy:#10296b; --blue:#2457d6; --pink:#e6007e; --ink:#0b1220; --bg:#f3f6fd; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); }
    h1,h2,h3,h4,h5 { font-family:'Poppins',sans-serif; color:var(--navy); }
    .side { position:fixed; inset:0 auto 0 0; width:250px; background:linear-gradient(180deg,#0b1a4a,#10296b); color:#cfd8f3; padding:1.4rem 1rem; display:flex; flex-direction:column; z-index:20; }
    .side .logo { background:#fff; border-radius:12px; padding:.55rem .8rem; display:inline-flex; margin-bottom:1.6rem; width:fit-content; }
    .side .logo img { height:34px; display:block; }
    .side a.nav-i { display:flex; align-items:center; gap:.7rem; color:#cfd8f3; text-decoration:none; padding:.7rem .9rem; border-radius:12px; margin-bottom:.25rem; font-weight:500; font-size:.95rem; }
    .side a.nav-i:hover { background:rgba(255,255,255,.08); color:#fff; }
    .side a.nav-i.on { background:linear-gradient(135deg,var(--blue),#7c3aed); color:#fff; box-shadow:0 8px 20px rgba(36,87,214,.35); }
    .side .badge-new { margin-left:auto; background:var(--pink); color:#fff; border-radius:50px; font-size:.72rem; padding:.15rem .55rem; }
    .side .bottom { margin-top:auto; font-size:.85rem; }
    .side .bottom .btn { width:100%; }
    .main { margin-left:250px; padding:2rem 2.2rem; }
    .cardx { background:#fff; border:1px solid #e3eafb; border-radius:18px; box-shadow:0 10px 30px rgba(16,41,107,.06); }
    .stat { padding:1.4rem; display:block; text-decoration:none; color:inherit; transition:.25s; height:100%; }
    .stat:hover { transform:translateY(-4px); box-shadow:0 18px 40px rgba(36,87,214,.16); color:inherit; }
    .stat .ic { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; font-size:1.4rem; color:#fff; background:linear-gradient(135deg,var(--blue),#7c3aed); }
    .stat .num { font-family:'Poppins',sans-serif; font-weight:700; font-size:2rem; color:var(--navy); line-height:1; }
    .pill { display:inline-block; padding:.2rem .7rem; border-radius:50px; font-size:.75rem; font-weight:600; }
    .pill.new { background:#ffe3f2; color:var(--pink); }
    .pill.contacted { background:#e1ecff; color:var(--blue); }
    .pill.closed, .pill.approved { background:#dcfce7; color:#15803d; }
    .pill.rejected { background:#fee2e2; color:#b91c1c; }
    table.t { width:100%; }
    table.t th { font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; color:#64748b; font-weight:600; padding:.8rem 1rem; border-bottom:1px solid #e3eafb; white-space:nowrap; }
    table.t td { padding:.85rem 1rem; border-bottom:1px solid #eef2fb; vertical-align:top; font-size:.92rem; }
    table.t tr:last-child td { border-bottom:0; }
    .msg { max-width:340px; white-space:pre-line; color:#475569; }
    .btn-brand { background:linear-gradient(135deg,var(--blue),#7c3aed); color:#fff; border:0; }
    .btn-brand:hover { color:#fff; opacity:.92; }
    .sel { border:1px solid #d6e0f7; border-radius:10px; font-size:.82rem; padding:.3rem .5rem; background:#fff; }
    @media (max-width: 991px) { .side { position:static; width:auto; flex-direction:row; flex-wrap:wrap; align-items:center; gap:.4rem; border-radius:0 0 18px 18px; } .side .logo { margin:0 1rem 0 0; } .side .bottom { margin:0 0 0 auto; } .main { margin-left:0; padding:1.2rem; } }
  </style>
</head>
<body>
{% if user.is_authenticated %}
<aside class="side">
  <a href="{% url 'home' %}" class="logo"><img src="{% static 'img/it_eric_logo.png' %}" alt="IT Eric"></a>
  <a class="nav-i {% if active == 'home' %}on{% endif %}" href="{% url 'dashboard_home' %}"><i class="bi bi-speedometer2"></i> Overview</a>
  {% for n in nav %}
    <a class="nav-i {% if active == n.key %}on{% endif %}" href="{% url 'dashboard_list' n.key %}"><i class="bi {{ n.icon }}"></i> {{ n.title }}{% if n.new %}<span class="badge-new">{{ n.new }}</span>{% endif %}</a>
  {% endfor %}
  <a class="nav-i mt-2" href="{% url 'home' %}"><i class="bi bi-box-arrow-up-right"></i> View Website</a>
  <div class="bottom">
    <div class="mb-2 opacity-75"><i class="bi bi-person-circle"></i> {{ user.get_username }}</div>
    <form method="post" action="{% url 'dashboard_logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Log out</button></form>
  </div>
</aside>
{% endif %}
<main class="{% if user.is_authenticated %}main{% endif %}">{% block body %}{% endblock %}</main>
</body>
</html>
